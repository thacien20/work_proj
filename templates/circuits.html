<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Lab</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/modulation_info.css">
    <style>
        /* Main layout */
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #66cbea 0%, #764ba2 100%);
            color: #f1f1f1;
            min-height: 100vh;
        }
        
        header {
            background: rgba(26, 46, 36, 0.8);
            backdrop-filter: blur(8px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
        }
        
        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .main-container {
            max-width: 1000px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }
        
        /* Panel styling */
        .panel {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(230, 33, 33, 0.08);
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
           
        }
        
        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        
        .panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
        }
        
        /* Plot container */
        .plot-container {
            width: 100%;
            height: 500px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .resizable-plot-wrapper {
            display: block;
            position: relative;
            min-width: 350px;
            min-height: 250px;
            width: 800px;
            height: 500px;
            max-width: 2000px;
            max-height: 1200px;
            resize: both;
            overflow: auto;
            background: rgba(255,255,255,0.98);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            margin: 0 auto 18px auto;
        }
        
        /* Circuit diagram */
        #circuit-diagram-img {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: contain;
            margin: 1rem auto;
            display: block;
            background: white;
            padding: 0.8rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Form controls */
        .form-group {
            margin-bottom: 0.8rem;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .control-input {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .control-input:focus {
            border-color: rgba(66, 153, 225, 0.6);
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
            outline: none;
        }
        
        .control-input:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* Compact form layout for signal settings */
        .compact-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.7rem;
            align-items: start;
        }
        
        /* Buttons */
        .primary-btn, .secondary-btn, .info-btn, .toggle-btn {
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            line-height: 1.2;
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #3182ce 0%, #4299e1 100%);
            color: white;
            border: none;
        }
        
        .primary-btn:hover, .primary-btn:focus {
            background: linear-gradient(135deg, #2c5282 0%, #3182ce 100%);
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }
        
        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .secondary-btn:hover, .secondary-btn:focus {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        
        .info-btn {
            background: rgba(49, 130, 206, 0.1);
            color: #63b3ed;
            border: 1px solid rgba(49, 130, 206, 0.3);
            padding: 0.3rem 0.7rem;
            font-size: 0.8rem;
        }
        
        .info-btn:hover {
            background: rgba(49, 130, 206, 0.2);
        }
        
        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
        }
        
        .toggle-btn[data-active="true"] {
            background: rgba(72, 187, 120, 0.2);
            border-color: rgba(72, 187, 120, 0.4);
            color: #9ae6b4;
        }
        
        .toggle-btn:hover {
            filter: brightness(120%);
        }
        
        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }
        
        .action-buttons button {
            flex: 1;
        }
        
        /* Circuit information */
        .equation-display {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            color: #a0aec0;
            margin-top: 0.3rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            
            .left-column, .right-column {
                width: 100%;
            }
        }

        /* Dropdown styling for demodulation buttons */
        .dropdown-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            width: 100%;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .dropdown-container:hover .dropdown-content {
            display: block;
        }
        
        .dropdown-item {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: left;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>🔌 Circuit Analysis Lab</h1>
        <a href="/" class="header-btn">← Back to Main</a>
    </header>

    <div class="main-container">
        <!-- Left Column: Controls -->
        <div class="left-column">
            <!-- Lab Mode Selection -->
            <div class="panel">
                <div class="action-buttons">
                    <button type="button" id="circuit-analysis-btn" class="primary-btn">
                        ⚡ Circuit Analysis
                    </button>
                    <button type="button" id="electronic-signals-btn" class="primary-btn">
                        📡 Electronic Signals
                    </button>
                </div>
            </div>

            <!-- Circuit Analysis Controls -->
            <div id="circuit-analysis-controls" class="panel" style="display: none;">
                <h2>⚙️ Simulation Parameters</h2>
                <div class="form-group">
                    <label for="circuit-type">Circuit Type:</label>
                    <select id="circuit-type" class="control-input">
                        <option value="rc">RC Circuit</option>
                        <option value="rl">RL Circuit</option>
                        <option value="rlc">RLC Circuit</option>
                        <option value="differentiator">Differentiator</option>
                        <option value="integrator">Integrator</option>
                    </select>
                </div>
                <div id="circuit-fields" class="compact-form"></div>
                
                <!-- Circuit Simulation Settings -->
                <div class="form-group" style="margin-top: 1rem;">
                    <label for="vin" id="vin-label">Input (V):</label>
                    <input type="number" id="vin" class="control-input" value="5.0" min="0.01" step="0.1">
                </div>
                <div class="compact-form" style="margin-top: 0.5rem;">
                    <div class="form-group">
                        <label for="circuit-duration">t (s):</label>
                        <input type="number" id="circuit-duration" class="control-input" value="0.01" min="0.001" step="0.001">
                    </div>
                    <div class="form-group">
                        <label for="circuit-points">Samples:</label>
                        <input type="number" id="circuit-points" class="control-input" value="1000" min="100" step="100">
                    </div>
                </div>
                <div class="form-group" id="show-current-container" style="margin-top: 0.5rem;">
                    <button type="button" id="show-current-btn" class="toggle-btn" data-active="false">
                        📊 Show Current
                    </button>
                </div>
                <button type="button" id="circuit-simulate-btn" class="primary-btn simulate-btn" style="width: 100%; margin-top: 0.8rem;">
                    🚀 Run Simulation
                </button>
            </div>

            <!-- Electronic Signals Controls -->
            <div id="electronic-signals-controls" class="panel" style="display: none;">
                <h2>⚙️ Simulation Parameters</h2>
                <div class="form-group">
                    <label for="signal-type">Signal Type:</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <select id="signal-type" class="control-input">
                            <option value="AM">Amplitude Modulation</option>
                            <option value="FM">Frequency Modulation</option>
                            <option value="QM">Quadrature Modulation</option>
                        </select>
                        <button type="button" id="quadrature-info-btn" class="info-btn" style="display: none;">ℹ️</button>
                    </div>
                </div>
                
                <!-- Signal Modulation Fields -->
                <div id="modulation-fields" class="compact-form" style="display: none;">
                    <div class="form-group">
                        <label for="carrier-freq">Carrier (Hz):</label>
                        <input type="number" id="carrier-freq" class="control-input" value="100" min="1" step="1">
                    </div>
                    <div class="form-group">
                        <label for="modulating-freq">Signal (Hz):</label>
                        <input type="number" id="modulating-freq" class="control-input" value="10" min="0.1" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="modulation-index">Mod Index:</label>
                        <input type="number" id="modulation-index" class="control-input" value="0.8" min="0.1" max="1.0" step="0.1">
                    </div>
                    <div class="form-group" style="grid-column: span 2; text-align: right;">
                        <button type="button" id="modulation-info-btn" class="info-btn" style="margin-left: auto;">ℹ️ Info</button>
                    </div>
                </div>

                <!-- Quadrature Signals Fields -->
                <div id="quadrature-fields" class="compact-form" style="display: none;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="quad-carrier-freq">Carrier Frequency (Hz):</label>
                        <input type="number" id="quad-carrier-freq" class="control-input" value="50" min="1" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="quad-i">I Frequency (Hz):</label>
                        <input type="number" id="quad-i" class="control-input" value="15" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="quad-q">Q Frequency (Hz):</label>
                        <input type="number" id="quad-q" class="control-input" value="20" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="quad-phase">Phase (deg):</label>
                        <input type="number" id="quad-phase" class="control-input" value="90" min="0" max="360" step="1">
                    </div>
                </div>

                <!-- Phase Locked Loop Fields -->
                <div id="pll-fields" class="compact-form" style="display: none;">
                    <div class="form-group">
                        <label for="pll-input-freq">Input (Hz):</label>
                        <input type="number" id="pll-input-freq" class="control-input" value="10.0" min="1" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="pll-vco-freq">VCO (Hz):</label>
                        <input type="number" id="pll-vco-freq" class="control-input" value="9.5" min="1" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="pll-loop-gain">Loop Gain:</label>
                        <input type="number" id="pll-loop-gain" class="control-input" value="0.1" min="0.01" step="0.01">
                    </div>
                </div>

                <!-- Demodulation Fields -->
                <div id="demodulation-fields" class="compact-form" style="display: none;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="demod-type">Demodulation Type:</label>
                        <select id="demod-type" class="control-input">
                            <option value="AM">AM Demodulation</option>
                            <option value="FM">FM Demodulation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="demod-carrier-freq">Carrier (Hz):</label>
                        <input type="number" id="demod-carrier-freq" class="control-input" value="10.0" min="1" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="demod-signal-freq">Signal (Hz):</label>
                        <input type="number" id="demod-signal-freq" class="control-input" value="1.0" min="0.1" step="0.1">
                    </div>
                </div>

                <!-- Signal Simulation Settings -->
                <div class="compact-form" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label for="signal-duration">Duration (s):</label>
                        <input type="number" id="signal-duration" class="control-input" value="1" min="0.001" step="0.001">
                    </div>
                    <div class="form-group">
                        <label for="signal-points">Samples:</label>
                        <input type="number" id="signal-points" class="control-input" value="5000" min="100" step="100">
                    </div>
                </div>
                <button type="button" id="signal-simulate-btn" class="primary-btn simulate-btn" style="width: 100%; margin-top: 0.8rem;">
                    🚀 Run Simulation
                </button>
            </div>

            <!-- Tools Panel -->
            <div class="panel">
                <h2>🔧 Tools</h2>
                <div class="action-buttons">
                    <button id="clear-plot-btn" class="secondary-btn" title="Clear the plot">🗑️ Clear</button>
                    <button id="save-plot-btn" class="secondary-btn" title="Save as PNG image">💾 Save</button>
                </div>
                
                <!-- QM-specific tools (only visible for QM) -->
                <div id="qm-tools" class="action-buttons" style="display: none; margin-top: 0.8rem;">
                    <!-- Demodulate dropdown -->
                    <div class="dropdown-container" style="flex: 1;">
                        <button type="button" id="quadrature-demod-btn" class="secondary-btn" style="width: 100%;">
                            🔄 Demodulate
                        </button>
                        <div class="dropdown-content">
                            <button type="button" id="demod-real-btn" class="dropdown-item">Real (I) Component</button>
                            <button type="button" id="demod-imag-btn" class="dropdown-item">Imaginary (Q) Component</button>
                        </div>
                    </div>
                    
                    <!-- FFT-QM button next to Demodulate -->
                    <button type="button" id="fft-qm-btn" class="secondary-btn" style="flex: 1;" title="Show frequency spectrum">
                        📊 FFT-QM
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Visualization -->
        <div class="right-column">
            <!-- Plot Panel -->
            <div class="panel">
                <div class="resizable-plot-wrapper" id="circuit-plot-wrapper">
                    <div id="circuit-plot" class="plot-container"></div>
                </div>
            </div>
            
            <!-- Quadrature I/Q Plot Panel (only shown for quadrature) -->
            <div class="panel" id="quadrature-iq-panel" style="display: none;">
                <div class="resizable-plot-wrapper" id="quadrature-iq-plot-wrapper">
                    <div id="quadrature-iq-plot" class="plot-container"></div>
                </div>
            </div>
            
            <!-- Information Panel -->
            <div class="panel" id="circuit-info-panel">
                <h2 id="info-panel-title">📖 Circuit Information</h2>
                <div>
                    <label>Equation:</label>
                    <div class="equation-display">
                        <span id="equation-text">Select a circuit or signal type to see its equation.</span>
                    </div>
                    <!-- Only show diagram button during circuit analysis mode -->
                    <div class="action-buttons" id="diagram-container">
                        <button id="show-diagram-btn" type="button" class="secondary-btn">🔍 View Circuit Diagram</button>
                    </div>
                    <img id="circuit-diagram-img" src="" alt="Circuit Diagram" style="display:none;" />
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/js/modulation_info.js"></script>
    <script src="/static/js/circuit_ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</body>
</html>
</html>
