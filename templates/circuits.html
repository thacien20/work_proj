<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Lab</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/modulation_info.css">
    <style>
        /* Main container adjustments */
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        /* Plot container size constraints */
        .plot-container {
            width: 100%;
            height: 400px;
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Circuit diagram size constraints */
        #circuit-diagram-img {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            margin: 10px auto;
            display: block;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        /* Right column adjustments */
        .right-column {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Plot section adjustments */
        .plot-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Info section adjustments */
        .info-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
        }

        /* Toggle button styles */
        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }
        
        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .toggle-btn[data-active="true"] {
            background: rgba(0, 255, 0, 0.2);
            border-color: rgba(0, 255, 0, 0.5);
            color: #00ff00;
        }
        
        .toggle-btn[data-active="false"] {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        /* Control input styling for compact layout */
        .control-input {
            width: 80px;
            padding: 4px 6px;
            margin: 2px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 13px;
            text-align: center;
        }

        .control-input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        /* Specific styling for different input types */
        #modulation-type, #electronic-signal-type {
            width: 90px;
        }

        #points {
            width: 70px;
        }

        #duration {
            width: 75px;
        }

        #modulation-index, #carrier-freq, #modulating-freq {
            width: 65px;
        }

        /* Form group adjustments for tighter layout */
        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            font-size: 13px;
            margin-bottom: 3px;
            display: block;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Compact electronic signals controls */
        #electronic-signals-controls {
            width: 250px; /* Make it narrower */
            margin-left: auto; /* Push to the right edge of left column */
        }

        #electronic-signals-controls .control-input {
            width: 80px; /* Make inputs smaller */
            padding: 4px 6px;
            font-size: 12px;
        }

        #electronic-signals-controls .form-group label {
            font-size: 11px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔌 Circuit Analysis Lab</h1>
        <a href="/" class="header-btn">← Back to Main</a>
    </header>

    <div class="main-container">
        <!-- Left Column: Controls -->
        <div class="left-column">
            <!-- Main Action Buttons -->
            <div class="control-section">
                <h2>� Lab Options</h2>
                <div class="form-group">
                    <button type="button" id="circuit-analysis-btn" class="primary-btn" style="margin-bottom: 10px;">
                        ⚡ Circuit Analysis
                    </button>
                </div>
                <div class="form-group">
                    <button type="button" id="electronic-signals-btn" class="primary-btn">
                        📡 Electronic Signals
                    </button>
                </div>
            </div>

            <!-- Circuit Analysis Controls -->
            <div id="circuit-analysis-controls" style="display: none;">
                <div class="control-section">
                    <h2>⚡ Circuit Parameters</h2>
                    <div class="form-group">
                        <label for="circuit-type">Circuit Type:</label>
                        <select id="circuit-type" class="control-input">
                            <option value="rc">RC Circuit</option>
                            <option value="rl">RL Circuit</option>
                            <option value="rlc">RLC Circuit</option>
                            <option value="differentiator">Differentiator</option>
                            <option value="integrator">Integrator</option>
                        </select>
                    </div>
                    <!-- Dynamic fields for circuit components will be injected here by JS -->
                    <div id="circuit-fields"></div>
                </div>
            </div>

            <!-- Electronic Signals Controls -->
            <div id="electronic-signals-controls" style="display: none;">
                <div class="control-section">
                    <div class="form-group">
                        <label for="signal-type">SigType:</label>
                        <select id="signal-type" class="control-input">
                            <option value="modulation">Modulation</option>
                            <option value="quadrature">Quadrature Signals</option>
                            <option value="pll">PLL</option>
                            <option value="demodulation">Signal Demodulation</option>
                        </select>
                    </div>
                    
                    <!-- Signal Modulation Fields -->
                    <div id="modulation-fields">
                        <div class="form-group">
                            <label for="modulation-type">Modulation:</label>
                            <div class="input-with-button">
                                <select id="modulation-type" class="control-input">
                                    <option value="AM">AM</option>
                                    <option value="FM">FM</option>
                                    <option value="PM">PM</option>
                                </select>
                                <button type="button" id="modulation-info-btn" class="info-btn">ℹ️</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="carrier-freq">Carrier(Hz):</label>
                            <input type="number" id="carrier-freq" class="control-input" value="10.0" min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="modulating-freq">Signal (Hz):</label>
                            <input type="number" id="modulating-freq" class="control-input" value="1.0" min="0.1" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="modulation-index">ModIndex:</label>
                            <input type="number" id="modulation-index" class="control-input" value="0.5" min="0.1" step="0.1">
                        </div>
                    </div>

                    <!-- Quadrature Signals Fields -->
                    <div id="quadrature-fields" style="display: none;">
                        <div class="form-group">
                            <label for="quad-frequency">Base Frequency (Hz):</label>
                            <input type="number" id="quad-frequency" class="control-input" value="5.0" min="0.1" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="quad-amplitude">Amplitude (V):</label>
                            <input type="number" id="quad-amplitude" class="control-input" value="1.0" min="0.1" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="quad-phase">Phase Shift (degrees):</label>
                            <input type="number" id="quad-phase" class="control-input" value="90" min="0" max="360" step="15">
                        </div>
                    </div>

                    <!-- Phase Locked Loop Fields -->
                    <div id="pll-fields" style="display: none;">
                        <div class="form-group">
                            <label for="pll-input-freq">Input Frequency (Hz):</label>
                            <input type="number" id="pll-input-freq" class="control-input" value="10.0" min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="pll-vco-freq">VCO Center Frequency (Hz):</label>
                            <input type="number" id="pll-vco-freq" class="control-input" value="9.5" min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="pll-loop-gain">Loop Gain:</label>
                            <input type="number" id="pll-loop-gain" class="control-input" value="0.1" min="0.01" step="0.01">
                        </div>
                    </div>

                    <!-- Demodulation Fields -->
                    <div id="demodulation-fields" style="display: none;">
                        <div class="form-group">
                            <label for="demod-type">Demodulation Type:</label>
                            <select id="demod-type" class="control-input">
                                <option value="AM">AM Demodulation</option>
                                <option value="FM">FM Demodulation</option>
                                <option value="PM">PM Demodulation</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="demod-carrier-freq">Carrier Frequency (Hz):</label>
                            <input type="number" id="demod-carrier-freq" class="control-input" value="10.0" min="1" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="demod-signal-freq">Signal Frequency (Hz):</label>
                            <input type="number" id="demod-signal-freq" class="control-input" value="1.0" min="0.1" step="0.1">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Simulation Settings - Always visible when a lab is selected -->
            <div id="simulation-settings" style="display: none;">
                <div class="control-section">
                    <div class="form-group">
                        <label for="vin">Input Voltage (V):</label>
                        <input type="number" id="vin" class="control-input" value="1.0" min="0.01" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (s):</label>
                        <input type="number" id="duration" class="control-input" value="0.01" min="0.001" step="0.001">
                    </div>
                    <div class="form-group">
                        <label for="points">Sample Points:</label>
                        <input type="number" id="points" class="control-input" value="1000" min="100" step="100">
                    </div>
                    <div class="form-group">
                        <button type="button" id="show-current-btn" class="toggle-btn" data-active="false">
                            📊 Show Current Plot
                        </button>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="button" id="simulate-btn" class="primary-btn">🚀 Simulate</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Visualization -->
        <div class="right-column">
            <div class="plot-section">
                <h2>📈 Circuit Response</h2>
                <div id="circuit-plot" class="plot-container"></div>
            </div>
            <div class="info-section" id="circuit-info-panel">
                <h2>📖 Information</h2>
                <div class="form-group">
                    <label>Equation/Description:</label>
                    <div class="equation-display">
                        <span id="equation-text">Select a circuit or signal type to see its equation.</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Diagram:</label>
                    <div style="margin-top: 5px;">
                        <button id="show-diagram-btn" type="button" class="secondary-btn">View Diagram</button>
                        <img id="circuit-diagram-img" src="" alt="Circuit Diagram" style="display:none; width:100%; margin-top:10px; border-radius:6px;" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Control Canvas -->
    <div class="vertical-signal-canvas">
        <button id="clear-plot-btn" title="Clear Plot">🗑️ Clear</button>
        <button id="undo-plot-btn" title="Undo Last">↶ Undo</button>
        <button id="export-plot-btn" title="Export Plot">💾 Export</button>
        <button id="save-plot-btn" title="Save Plot">📁 Save</button>
    </div>

    <!-- Floating Electronic Signals Panel -->
    <div class="floating-electronic-signals">
        <h3>📡 Electronic Signal Settings</h3>
        <div class="form-group">
            <label for="signal-amplitude">Amplitude (V):</label>
            <input type="number" id="signal-amplitude" class="control-input" value="1.0" min="0.1" step="0.1">
        </div>
        <div class="form-group">
            <label for="signal-offset">Offset (V):</label>
            <input type="number" id="signal-offset" class="control-input" value="0.0" min="-10" max="10" step="0.1">
        </div>
        <div class="form-group">
            <label for="signal-phase">Phase (degrees):</label>
            <input type="number" id="signal-phase" class="control-input" value="0" min="-360" max="360" step="1">
        </div>
        <div class="form-group">
            <button type="button" id="apply-signal-btn" class="primary-btn" style="width: 100%;">
                ✔️ Apply Signal
            </button>
        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/js/modulation_info.js"></script>
    <script src="/static/js/circuit_frontEnd.js"></script>
    <script src="/static/js/circuit_ui.js"></script>
</body>
</html>
