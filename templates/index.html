<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal FFT Demo</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <h1>Signal Processing Demo</h1>
    </header>
    <main>
        <!-- Files dropdown button, place this where your Files button was -->
        <div class="file-dropdown">
            <button id="filesBtn" class="file-button">Files ▼</button>
            <div class="file-dropdown-content">
                <button type="button" id="exportBtn">Export CSV</button>
                <input type="file" id="importFile" accept=".csv" style="display:none">
                <button type="button" id="importBtn">Import CSV</button>
            </div>
        </div>
        <div class="sidebar">
            <button class="main-btn" id="processingBtn">Processing</button>
            <div class="dropdown" id="filterDropdownContainer">
                <button class="dropbtn" id="filterBtn">Filter ▼</button>
                <div class="dropdown-content" id="filterDropdownContent">
                    <button type="button" id="filterBtn_highPass">High Pass Filter</button>
                    <button type="button" id="filterBtn_lowPass">Low Pass Filter</button>
                    <button type="button" id="filterBtn_bandPass">Band Pass Filter</button>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" id="analyzeBtn">Analyze ▼</button>
                <div class="dropdown-content" id="analyzeDropdown">
                    <button type="button" id="analyzeBtn_convolution">Convolution</button>
                    <button type="button" id="analyzeBtn_deconvolution">Deconvolution</button>
                    <button type="button" id="analyzeBtn_correlation">Correlation</button>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" id="operationsBtn">Operations ▼</button>
                <div class="dropdown-content" id="operationsDropdown">
                    <button type="button" id="opsBtn_add">Add</button>
                    <button type="button" id="opsBtn_subtract">Subtract</button>
                    <button type="button" id="opsBtn_multiply">Multiply</button>
                    <button type="button" id="opsBtn_divide">Divide</button>
                </div>
            </div>
        </div>
        <section id="signal-section">
            <form id="signalForm">
                <div class="form-group">
                    <label for="frequency">Frequency (Hz, 0.1–1000):</label>
                    <input type="number" id="frequency" name="frequency" min="0.1" max="1000" step="0.1" value="50.12" required>
                </div>
                <!-- Phase control input, replaced button with number input -->
                <div class="form-group" id="phaseGroup" style="display:none;">
                    <label for="phaseValue">Phase (degrees):</label>
                    <input type="number" id="phaseValue" name="phaseValue" min="0" max="360" step="10" value="0" style="width:70px; text-align:center;">
                </div>
                <!-- Multi-frequency support -->
                <div class="form-group" id="multiFreqGroup" style="display:none;">
                    <label for="multiFrequencies">Frequencies ( Hz):</label>
                    <input type="text" id="multiFrequencies" name="multiFrequencies" placeholder="e.g., 120 200 300" value="120, 200, 300">
                </div>
                <div class="form-group" id="multiAmpGroup" style="display:none;">
                    <label for="multiAmplitudes">Amplitudes (optional):</label>
                    <input type="text" id="multiAmplitudes" name="multiAmplitudes" placeholder="e.g., 1 1 1" value="1 1 1">
                </div>
                <div class="form-group">
                    <label for="points">Points (1024–65000):</label>
                    <input type="number" id="points" name="points" min="1024" max="65000" step="64" value="1024" required>
                </div>
                <div class="form-group">
                    <label for="noise">Noise Level (0–1):</label>
                    <input type="number" id="noise" name="noise" min="0" max="1" step="0.01" value="0.1" required>
                </div>
                <div class="form-group">
                    <label for="signalType">Signal Type:</label>
                    <select id="signalType" name="signalType">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                        <option value="multi">Multi</option>
                    </select>
                </div>
                <div class="button-group">
                    <button type="button" id="generateBtn">Generate Signal</button>
                    <button type="button" id="addOverlayBtn">Add Overlay</button>
                </div>
            </form>

            <div class="canvas-container" style="position:relative;">
                <div id="plot"></div>
                <p class="zoom-instructions">Drag to zoom in, double-click to reset zoom</p>
                <button type="button" id="clearBtn" class="plot-clear-btn">Clear</button>
            </div>
        </section>
    </main>
    <script type="module" src="/static/js/ui.js"></script>
    <script>
    // Show/hide multi-frequency and custom formula fields
    document.addEventListener('DOMContentLoaded', function() {
        const signalType = document.getElementById('signalType');
        const multiFreqGroup = document.getElementById('multiFreqGroup');
        const phaseGroup = document.getElementById('phaseGroup');
        function updateFields() {
            multiFreqGroup.style.display = (signalType.value === 'multi') ? '' : 'none';
            phaseGroup.style.display = (signalType.value !== 'multi') ? '' : 'none';
        }
        signalType.addEventListener('change', updateFields);
        updateFields();
    });
    </script>
</body>
</html>
