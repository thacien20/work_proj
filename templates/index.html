<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal FFT Demo</title>
    <link rel="stylesheet" href="/static/css/styles.css">
        <script src="https://cdn.plot.ly/plotly-latest.min.js" charset="utf-8"></script>
    
</head>
<body>
    <header>
        <h1>Signal Processing and Visualization </h1>
    </header>
    <!-- Galaxy sidebar moved far left, partially off-screen -->
    <div id="galaxy-sidebar" style="
        position:fixed;
        left:5;
        top:113px;
        width:120px;
        height:160px;
        z-index:1000;
        background:transparent;
        display:flex;
        align-items:flex-end;
        justify-content:right;
        pointer-events:none;
    ">
        <canvas id="galaxy-canvas" width="120" height="120" style="display:block; margin:0 auto; background:#101020; border-radius:10px; pointer-events:none;"></canvas>
    </div>
    
    <!-- Rwanda flag canvas container -->
    <div id="rwanda-canvas-container" style="
        position:fixed;
        right:20px;
        top:120px;
        width:240px;
        height:240px;
        z-index:999;
        pointer-events:none;
        background:rgba(0,0,0,0.1);
        border-radius:50%;
        border:2px solid rgba(255,255,255,0.2);
        overflow:hidden;
    ">
        <img id="rwanda-flag" src="/static/imag/rwanda.PNG" alt="Rwanda Flag" style="
            position:absolute;
            width:240px;
            height:240px;
            object-fit:cover;
            object-position:center;
            border-radius:50%;
            box-shadow:0 10px 30px rgba(0,0,0,0.9);
            left:50%;
            top:50%;
            transform:translate(-50%, -50%);
        ">
    </div>

    <style>
        #rwanda-canvas-container:hover {
            background:rgba(0,0,0,0.2);
        }
    </style>
    <main style="display: flex; flex-direction:row-reverse; align-items: flex-start;">
        <!-- Removed old galaxy-sidebar from here -->
        <div style="flex:1;">
        <!-- Files dropdown button, place this where your Files button was -->
        <div class="file-dropdown">
            <button id="filesBtn" class="file-button">Files ▼</button>
            <div class="file-dropdown-content">
                <button type="button" id="exportBtn">Export CSV</button>
                <input type="file" id="importFile" accept=".csv" style="display:none">
                <button type="button" id="importBtn">Import CSV</button>
            </div>
        </div>
        <div class="sidebar">
            <button class="main-btn" id="processingBtn">Processing</button>
            <div class="dropdown" id="filterDropdownContainer">
                <button class="dropbtn" id="filterBtn">Filter ▼</button>
                <div class="dropdown-content" id="filterDropdownContent">
                    <button type="button" id="filterBtn_highPass">High Pass Filter</button>
                    <button type="button" id="filterBtn_lowPass">Low Pass Filter</button>
                    <button type="button" id="filterBtn_bandPass">Band Pass Filter</button>
                    <button type="button" id="filterBtn_view">Filter View</button> <!-- New button for filter visualization -->
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" id="analyzeBtn">Analyze ▼</button>
                <div class="dropdown-content" id="analyzeDropdown">
                    <button type="button" id="analyzeBtn_correlation">Correlation</button>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn" id="operationsBtn">Operations ▼</button>
                <div class="dropdown-content" id="operationsDropdown">
                    <button type="button" id="opsBtn_add">Add</button>
                    <button type="button" id="opsBtn_subtract">Subtract</button>
                    <button type="button" id="opsBtn_multiply">Multiply</button>
                    <button type="button" id="opsBtn_divide">Divide</button>
                </div>
            </div>
        </div>
        <section id="signal-section">
            <form id="signalForm">
                <div class="form-group">
                    <label for="frequency">Frequency (Hz, 0.1–1000):</label>
                    <input type="number" id="frequency" name="frequency" min="0.1" max="1000" step="any" value="50.12" required>
                </div>
                <!-- Phase control input, replaced button with number input -->
                <div class="form-group" id="phaseGroup" style="display:none;">
                    <label for="phaseValue">Phase (degrees):</label>
                    <input type="number" id="phaseValue" name="phaseValue" min="0" max="360" step="10" value="0" style="width:70px; text-align:center;">
                </div>
                <!-- Multi-frequency support -->
                <div class="form-group" id="multiFreqGroup" style="display:none;">
                    <label for="multiFrequencies">Frequencies ( Hz):</label>
                    <input type="text" id="multiFrequencies" name="multiFrequencies" placeholder="e.g., 120 200 300" value="120, 200, 300">
                </div>
                <div class="form-group" id="multiAmpGroup" style="display:none;">
                    <label for="multiAmplitudes">Amplitudes (optional):</label>
                    <input type="text" id="multiAmplitudes" name="multiAmplitudes" placeholder="e.g., 1 1 1" value="1 1 1">
                </div>
                <div class="form-group">
                    <label for="points">Points (1024–65000):</label>
                    <input type="number" id="points" name="points" min="1024" max="65000" step="64" value="1024" required>
                </div>
                <div class="form-group">
                    <label for="noise">Noise Level (0–1):</label>
                    <input type="number" id="noise" name="noise" min="0" max="1" step="0.01" value="0.1" required>
                </div>
                <div class="form-group">
                    <label for="signalType">Signal Type:</label>
                    <select id="signalType" name="signalType">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                        <option value="multi">Multi</option>
                        <option value="expdecay">Exponential Decay</option>
                        <option value="random">Random Noise</option>
                        <option value="gaussian">Gaussian Noise</option>
                    </select>
                </div>
                <!-- Tau input for exponential decay -->
                <div class="form-group" id="tauGroup" style="display:none;">
                    <label for="tauValue">Decay Constant τ (seconds):</label>
                    <input type="number" id="tauValue" name="tauValue" min="0.001" max="10" step="0.001" value="0.05" style="width:90px; text-align:center;">
                </div>
                <div class="button-group">
                    <button type="button" id="generateBtn">Generate Signal</button>
                    <button type="button" id="livePlotBtn">Live Plot</button>
                    <button type="button" id="addOverlayBtn">Add Overlay</button>
                    <button type="button" id="deconvBtn" style="display:none; margin-left:10px;">Deconvolution</button>
                </div>
            </form>

            <div class="button-stack">
                <button type="button" id="clearBtn" class="plot-clear-btn">Clear</button>
                <button type="button" id="undo-btn" class="plot-undo-btn">Undo</button>
            </div>
            <div id="custom-legend" class="custom-legend" style="margin: 12px 0 12px 0; position:relative; left:0; z-index:100;"></div>
            <div id="plot" style="width:900px;height:600px;"></div>
            <p class="zoom-instructions">Drag to zoom in, double-click to reset zoom</p>
            <div id="deconv-slider-container" style="display:none; margin-top:10px;">
                <label for="deconvRegSlider">Deconvolution Regularization (epsilon): </label>
                <input type="range" id="deconvRegSlider" min="-9" max="-2" step="0.1" value="-6">
                <span id="deconvRegValue">1e-6</span>
            </div>
            <!-- Warning box for multi signal type -->
            <div id="multi-warning" style="display:none;"></div>
        </section>
    </main>
    <script type="module" src="/static/js/ui.js"></script>
    <script type="module" src="/static/js/galaxy.js"></script>
    <script>
    // Rwanda flag depth animation (traveling through space)
    function animateRwandaFlag() {
        const flag = document.getElementById('rwanda-flag');
        let animationFrame;
        let startTime = Date.now();
        
        function animateDepth() {
            const currentTime = Date.now();
            const elapsed = (currentTime - startTime) / 1000; // Convert to seconds
            
            // Create a sine wave for smooth back-and-forth motion (4 second cycle - faster)
            const cycle = (Math.sin(elapsed * Math.PI / 2) + 1) / 2; // 0 to 1
            
            // Scale: from 1.0 (fills canvas) to 2.0 (very close/zoomed in) - NO EMPTY SPACE
            const scale = 1.0 + (cycle * 1.0);
            
            // Opacity: from 0.7 (slightly faded) to 1.0 (fully visible)
            const opacity = 0.7 + (cycle * 0.3);
            
            // Faster rotation for more dynamic effect
            const rotation = elapsed * 15; // Faster rotation: 15°/second
            
            // Apply the transform with scaling, opacity, and rotation
            flag.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${rotation}deg)`;
            flag.style.opacity = opacity;
            
            animationFrame = requestAnimationFrame(animateDepth);
        }
        
        // Start the animation
        animateDepth();
    }
    
    // Start animation when page loads
    document.addEventListener('DOMContentLoaded', animateRwandaFlag);
    
    // Show/hide multi-frequency and custom formula fields
    document.addEventListener('DOMContentLoaded', function() {
        const signalType = document.getElementById('signalType');
        const multiFreqGroup = document.getElementById('multiFreqGroup');
        const phaseGroup = document.getElementById('phaseGroup');
        const tauGroup = document.getElementById('tauGroup');
        function updateFields() {
            multiFreqGroup.style.display = (signalType.value === 'multi') ? '' : 'none';
            phaseGroup.style.display = (signalType.value !== 'multi') ? '' : 'none';
            tauGroup.style.display = (signalType.value === 'expdecay') ? '' : 'none';
        }
        signalType.addEventListener('change', updateFields);
        updateFields();
    });
    </script>

    <!-- Modal for filter visualization -->
    <div id="filterViewModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" id="closeFilterView">&times;</span>
            <h2>Filter Visualization</h2>
            <div id="filter-view-plot"></div>
        </div>
    </div>
</body>
</html>
