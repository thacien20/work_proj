<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal FFT Demo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#education">Education</a>
                    <ul>
                        <li><a href="#signal">Signal</a></li>
                    </ul>
                </li>
                <li><a href="#health">Health</a></li>
                <li><a href="#ict">ICT</a></li>
                <li><a href="#ai">AI</a></li>
                <li><a href="#science">Science</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home">
            <h1>Welcome to My Website</h1>
            <p>Explore topics in signal processing, health, ICT, AI, and science.</p>
        </section>
        <section id="education">
            <h2>Education</h2>
            <section id="signal">
                <h3>Signal Processing</h3>
                <form id="signalForm">
                    <label for="frequency">Frequency (Hz, 0.1–100):</label>
                    <input type="number" id="frequency" name="frequency" min="0.1" max="100" step="0.1" value="5" required><br>
                    <label for="points">Points (power of 2, 64–8192):</label>
                    <input type="number" id="points" name="points" min="64" max="8192" step="64" value="1024" required><br>
                    <label for="noise">Noise Level (0–1):</label>
                    <input type="number" id="noise" name="noise" min="0" max="1" step="0.01" value="0.1" required><br>
                    <label for="signalType">Signal Type:</label>
                    <select id="signalType" name="signalType">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                        <option value="custom">Custom</option>
                    </select><br>
                    <label for="customFormula">Custom Formula (use 't' for time, e.g. sin(2*pi*frequency*t) + 0.5*sin(4*pi*frequency*t)):</label>
                    <input type="text" id="customFormula" name="customFormula" placeholder="Only used if 'Custom' selected"><br>
                    <button type="button" onclick="generateSignal()">Generate Signal</button>
                    <button type="button" onclick="exportCSV()">Export CSV</button>
                    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
                    <button type="button" onclick="document.getElementById('importFile').click()">Import CSV</button>
                    <button type="button" onclick="addOverlay()">Add Overlay</button>
                </form>
                <div class="canvas-container">
                    <div class="canvas-wrapper">
                        <h4>Time & Frequency Domain</h4>
                        <canvas id="combinedCanvas" width="400" height="600"></canvas>
                    </div>
                </div>
            </section>
        </section>
    </main>
    <footer>
        <p>© 2025 My Website</p>
    </footer>
    <script src="/static/script.js"></script>
</body>
</html>
